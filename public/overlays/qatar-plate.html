<meta charset="utf-8">
<title>Qatar Plate — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   QATAR PLATE — live nameplate overlay
   نفس فكرة top3: مسرح ثابت 1920x1080 بيتظبط على أي مقاس
   بيديهوله OBS. الفرق إن الخلفية هنا فيديو webm بألفا بدل
   صور — فالحركة اللي اتصممت بتفضل زي ما هي بالمللي، وإحنا
   بنحط البيانات الحيّة فوقها بس.
   ============================================================ */
:root{
  --violet:    #a855f7;
  --violet-hot:#e9d5ff;
  --ink:       #ffffff;

  /* اللوحة الغامقة جوه الإطار — المكان اللي البيانات بتقع فيه.
     القيم دي متقاسة من الفيديو نفسه، ومتسايبة كمتغيّرات عشان
     تتظبط من الرابط من غير ما نفتح الملف. */
  --panel-x:  954px;   /* مركز اللوحة أفقياً  */
  --panel-y:  535px;   /* مركز اللوحة رأسياً  */
  --panel-w: 1080px;
  --panel-h:  280px;

  --label-size: 30px;
  --name-size:  86px;
  --value-size: 40px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:transparent;          /* OBS بيركّب فوق البث — ممنوع أي أرضية */
  overflow:hidden;
  font-family:"Cairo",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}

/* ---------- الخلفية المتحركة ---------------------------------- */
/* الفيديو هو التصميم كله: الإطار، الضوء اللي بيمشي، التوهج الداخلي.
   بيلف من غير صوت ومن غير تحكم — مجرد طبقة بتتنفّس تحت البيانات. */
#bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  pointer-events:none;
}

/* ---------- اللوحة الحيّة ------------------------------------- */
.panel{
  position:absolute;
  left:var(--panel-x);top:var(--panel-y);
  width:var(--panel-w);height:var(--panel-h);
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:6px;
  text-align:center;
  line-height:1.1;
}

/* العنوان الصغير فوق الاسم — "آخر داعم" وكده */
.label{
  font-size:var(--label-size);font-weight:800;
  letter-spacing:.14em;
  color:#f6ecff;               /* كان بنفسجي فاتح على لوحة بنفسجية — بيدوب */
  opacity:1;
  text-shadow:0 2px 5px rgba(0,0,0,.95), 0 0 16px rgba(168,85,247,.6);
}

/* الاسم — بيصغّر لوحده لو طويل بدل ما يخرج بره اللوحة أو يتقص.
   أسامي التيك توك أطوالها عبط، وده بيحصل كتير. */
.name{
  font-size:var(--name-size);font-weight:900;
  color:var(--ink);
  white-space:nowrap;
  max-width:100%;
  /* التدرّج بينتهي عند بنفسجي فاتح مش غامق — الغامق كان بيدوب
     في اللوحة اللي وراه فيتقرا نص الحرف بس */
  background:linear-gradient(180deg,#ffffff 22%,#f3e6ff 58%,var(--violet-hot) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,1)) drop-shadow(0 0 22px rgba(168,85,247,.6));
}

/* الرقم — tabular-nums عشان الأرقام ماترقصش وهي بتعد */
.value{
  display:flex;align-items:center;gap:10px;
  font-size:var(--value-size);font-weight:800;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  text-shadow:0 0 4px rgba(0,0,0,.95), 0 0 16px rgba(168,85,247,.85);
}
.value svg{width:1em;height:1em;flex:none;filter:drop-shadow(0 0 6px rgba(233,213,255,.9))}
.value.hidden{display:none}

/* ---------- اللحظة المنسّقة: الاسم بيتغيّر --------------------- */
/* دي الحاجة اللي بتخلي التركيبة تبان غالية. ثابتة = عادية،
   لكن لما الاسم يتبدّل قدام الجمهور دي اللحظة اللي بتتشاف. */
.panel.swap .name {animation:takeover .72s cubic-bezier(.2,.9,.25,1)}
.panel.swap .label{animation:fadein  .5s  cubic-bezier(.2,.9,.25,1)}
@keyframes takeover{
  0%  {opacity:0;transform:translateY(14px) scale(.88);filter:brightness(2.4)}
  60% {opacity:1;transform:translateY(0)    scale(1.04)}
  100%{opacity:1;transform:none}
}
@keyframes fadein{from{opacity:0}to{opacity:.82}}

/* حالة فاضية — لسه مفيش داتا */
.panel.empty .name {opacity:.45}
.panel.empty .label{opacity:.5}

#stage.enter .panel{animation:rise .8s cubic-bezier(.2,.9,.25,1) backwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,calc(-50% + 18px))}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>

<div id="stage">
  <video id="bg" autoplay loop muted playsinline disablepictureinpicture></video>

  <div class="panel" id="panel">
    <span class="label" id="label"></span>
    <span class="name"  id="name"></span>
    <span class="value" id="value"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STAGE_W = 1920, STAGE_H = 1080;
  var stage  = document.getElementById("stage");
  var params = new URLSearchParams(location.search);

  var panel = document.getElementById("panel");
  var elLabel = document.getElementById("label");
  var elName  = document.getElementById("name");
  var elValue = document.getElementById("value");

  var GEM = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            '<path d="M12 2l7 6.5-7 13.5L5 8.5z" fill="#e9d5ff"/>' +
            '<path d="M12 2l7 6.5H5z" fill="#ffffff"/></svg>';

  /* مصدر الفيديو — يتغيّر من الرابط لو حبينا نجرّب تصميم تاني
     على نفس المنطق من غير ما نلمس الملف */
  document.getElementById("bg").src = params.get("video") || "qatar1.webm";

  /* المسرح 1920x1080 بيتقاس على المقاس اللي OBS بيديهوله،
     فالتركيبة بتطلع مظبوطة سواء المصدر 800 أو 1920 */
  function fit() {
    var s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
    stage.style.transform =
      "translate(" + ((innerWidth  - STAGE_W * s) / 2) + "px," +
                     ((innerHeight - STAGE_H * s) / 2) + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();

  /* ضبط من الرابط — مكان اللوحة ومقاسات الخط والألوان.
     كده نفس الملف بيخدم تصاميم وأحجام مختلفة من غير تعديل. */
  ["panel-x","panel-y","panel-w","panel-h",
   "label-size","name-size","value-size",
   "violet","violet-hot","ink"].forEach(function (k) {
    var v = params.get(k);
    if (v) document.documentElement.style.setProperty("--" + k, v);
  });

  /* الاسم بيصغّر لحد ما يظبط جوه اللوحة بدل ما يخرج أو يتقص */
  var baseName = parseFloat(getComputedStyle(document.documentElement)
                   .getPropertyValue("--name-size")) || 86;
  function fitName() {
    var size = baseName, room = panel.clientWidth;
    elName.style.fontSize = size + "px";
    while (elName.scrollWidth > room && size > baseName * 0.45) {
      size -= 2;
      elName.style.fontSize = size + "px";
    }
    if (elName.scrollWidth > room) {
      elName.style.overflow = "hidden";
      elName.style.textOverflow = "ellipsis";
    }
  }

  function group(n) { return (n || 0).toLocaleString("en-US"); }

  /* الرقم بيعدّ لحد قيمته بدل ما ينط — الحركة بتلفت النظر ناحيته */
  var current = 0;
  function countTo(target) {
    var from = current;
    if (from === target) { elValue.lastChild.nodeValue = group(target); return; }
    var t0 = performance.now(), dur = 620;
    (function step(now) {
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      elValue.lastChild.nodeValue = group(Math.round(from + (target - from) * e));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
    current = target;
  }

  var key = null;

  function set(data) {
    data = data || {};

    if (!elValue.firstChild) {
      elValue.innerHTML = GEM;
      elValue.appendChild(document.createTextNode("0"));
    }

    var name = data.name || data.username || "";
    if (!name) {
      panel.classList.add("empty");
      elLabel.textContent = data.label || "";
      elName.textContent  = "في انتظار البث…";
      elValue.classList.add("hidden");
      fitName();
      key = null; current = 0;
      return;
    }

    panel.classList.remove("empty");
    elLabel.textContent = data.label || "";

    var fresh = key !== String(data.key || name);
    if (fresh) {
      elName.textContent = name;
      fitName();
      current = 0;
      /* إعادة تشغيل الأنيميشن — من غير الـreflow دي المتصفح
         بيعتبرها نفس الحالة ومابيشغّلهاش تاني */
      panel.classList.remove("swap");
      void panel.offsetWidth;
      panel.classList.add("swap");
    }
    key = String(data.key || name);

    var val = data.value;
    if (val === undefined || val === null || val === "") {
      elValue.classList.add("hidden");
    } else {
      elValue.classList.remove("hidden");
      countTo(Number(val) || 0);
    }
  }

  /* نفس شكل الواجهة اللي في top3 — عشان أي تركيبة جديدة
     تتوصّل بالسيرفر بنفس الطريقة من غير ما نخترع كل مرة */
  window.Plate = {
    set: set,
    connect: function (url) {
      var tries = 0;
      (function open() {
        var ws = new WebSocket(url);
        ws.onopen    = function () { tries = 0; };
        ws.onmessage = function (ev) {
          try {
            var m = JSON.parse(ev.data);
            if (m.type === "plate" || m.name) set(m.data || m);
          } catch (err) {}
        };
        ws.onclose = function () {
          tries++;
          setTimeout(open, Math.min(30000, 1000 * Math.pow(2, tries)));
        };
      })();
    }
  };

  /* تغيير الألوان والمقاسات وهي شغّالة — من غير إعادة تحميل.
     ده اللي بيخلي العميل يحرّك سلايدر ويشوف تركيبته بتتغيّر قدامه،
     سواء في صفحة المنتج أو من موبايله وهو لايف. */
  function theme(vars) {
    Object.keys(vars || {}).forEach(function (k) {
      if (vars[k]) document.documentElement.style.setProperty("--" + k, vars[k]);
    });
  }
  window.Plate.theme = theme;

  addEventListener("message", function (ev) {
    if (!ev.data) return;
    if (ev.data.type === "plate") set(ev.data.data);
    if (ev.data.type === "plate-theme") theme(ev.data.vars);
  });

  /* ---------- وضع العرض ---------------------------------------
     هنا مفتوح افتراضياً عشان دي نسخة تجريبية للعرض.
     في نسخة العميل بيتقلب: مقفول إلا لو ?demo=1 — وإلا هتظهر
     أسامي وهمية على بثه قدام جمهوره. */
  var CAST = [
    { key:"a", label:"آخـر داعــم",   name:"Mike_Gaming",       value:18420 },
    { key:"b", label:"آخـر داعــم",   name:"سارة",              value:15980 },
    { key:"c", label:"أكبـر داعــم",  name:"خالد المحترف",       value:24310 },
    { key:"d", label:"آخـر متابــع",  name:"NightFury",         value:null  },
    { key:"e", label:"أكبـر داعــم",  name:"عبدالرحمن القحطاني", value:31200 }
  ];

  function demo() {
    var i = 0;
    (function tick() {
      set(CAST[i % CAST.length]);
      i++;
      setTimeout(tick, 4200);
    })();
  }

  function boot() {
    /* قيم مباشرة من الرابط — مفيدة للمعاينة في صفحة المنتج */
    if (params.get("name")) {
      set({ label: params.get("label") || "", name: params.get("name"),
            value: params.get("value") });
      return;
    }

    set({ label: params.get("label") || "" });
    requestAnimationFrame(function () { stage.classList.add("enter"); });

    if (params.get("demo") !== "0") {
      setTimeout(function () { if (key === null) demo(); }, 900);
    }
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
  else boot();
})();
</script>
