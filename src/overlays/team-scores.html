<meta charset="utf-8">
<title>Team Scores — Tilago</title>
<style>
/* ============================================================
   TEAM SCORES — تحدي فريقين

   بتشتغل لوحدها بالكامل: مفيش سيرفر ولا اتصال بأي حاجة.

     ?t1=الأحمر&t2=الأزرق&s1=12&s2=9&c1=%23A855F7&c2=%2322D3EE
     &title=تحدي الهدايا&unit=نقطة&until=2026-09-19T22:00

   فكرة التصميم: الشريط نفسه هو النتيجة — عرض كل لون نصيب فريقه،
   فالمتفرج يعرف مين كاسب من نظرة قبل ما يقرا رقم.

   الحركة مستمرة بس هادية: موجة ضوء بتعدّي جوه اللون كل 7 ثواني.
   مقصود إنها موجة عريضة مش خطوط رفيعة — الخطوط الرفيعة بتعمل
   نمنمة وتشويش لما الفيديو يتضغط على تيك توك.
   ============================================================ */
@font-face{font-family:'Cairo';src:url('/fonts/cairo-bold.ttf') format('truetype');font-weight:700;font-display:block}
@font-face{font-family:'Cairo';src:url('/fonts/cairo-black.ttf') format('truetype');font-weight:900;font-display:block}
@font-face{font-family:'Oxanium';src:url('/fonts/oxanium-extrabold.ttf') format('truetype');font-weight:800;font-display:block}

:root{
  --violet:#7F3AA1; --grape:#5416B5; --navy:#0F083B; --deep:#0C0516;
  --ink:#ffffff;
  --c1:#A855F7;
  --c2:#22D3EE;
  --h:132px;      /* ارتفاع الشريط */
  --cut:30px;     /* ميل الأطراف */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:transparent;          /* OBS بيركّب فوق البث */
  font-family:'Cairo',system-ui,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}
#wrap{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:1560px}

/* ---------- الصفيحتين فوق ------------------------------- */
/* الأرقام فوق الفاصل مباشرة — أول حاجة العين تروح لها */
/* الصفيحتين بتتحركوا مع الفاصل — الشكل كله بيفضل قطعة واحدة */
#wings{position:relative;height:96px;z-index:3}
.wing{
  position:absolute;bottom:0;width:250px;height:88px;
  display:flex;align-items:center;justify-content:center;
  transition:left .6s cubic-bezier(.22,1,.3,1),
             transform .3s cubic-bezier(.34,1.5,.64,1);
}
.wing.a{left:calc(var(--pct,50%) - 248px);clip-path:polygon(38px 0,100% 0,100% 100%,0 100%)}
.wing.b{left:calc(var(--pct,50%) - 2px);clip-path:polygon(0 0,calc(100% - 38px) 0,100% 100%,0 100%)}
.wing::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.3)),var(--col);
}
.wing::after{  /* خط لمعة علوي — بيدّي حس معدن */
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
}
.sc{
  position:relative;z-index:2;
  font-family:'Oxanium',sans-serif;font-variant-numeric:tabular-nums;
  font-size:74px;font-weight:800;line-height:1;color:#fff;
  text-shadow:0 3px 10px rgba(0,0,0,.55);
  transition:transform .3s cubic-bezier(.34,1.6,.64,1);
}
.sc.bump{transform:scale(1.2)}
.wing.win{transform:translateY(-8px)}

/* ---------- الشريط ------------------------------------- */
#bar{
  position:relative;height:var(--h);overflow:hidden;
  clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);
  background:#0a0418;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.55));
}
.half{position:absolute;top:0;bottom:0;overflow:hidden}
.half::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.34)),var(--col);
}
/* موجة الضوء — عريضة وبطيئة، بتدّي حياة من غير ما تشد العين */
.half::after{
  content:'';position:absolute;top:-40%;bottom:-40%;left:-60%;width:46%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.17) 45%,transparent);
  transform:skewX(-16deg);
  animation:sweep 7s linear infinite;
}
.half.b::after{animation-delay:3.5s}
@keyframes sweep{0%{left:-60%}100%{left:170%}}

#hA{left:0;width:50%;transition:width .6s cubic-bezier(.22,1,.3,1)}
#hB{right:0;left:auto;width:50%}

/* الفاصل — شفرة مايلة بنفس ميل الأطراف */
#blade{
  position:absolute;top:-14px;bottom:-14px;left:50%;width:30px;
  transform:translateX(-50%) skewX(-13deg);
  background:linear-gradient(180deg,#241442,#06030f);
  box-shadow:0 0 0 3px rgba(255,255,255,.16);
  transition:left .6s cubic-bezier(.22,1,.3,1);z-index:4;
}
#blade i{  /* شرارة رفيعة في نص الشفرة */
  position:absolute;top:14%;bottom:14%;left:50%;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.85),transparent);
}
/* ومضة واحدة قصيرة عند التسجيل — مش نبض مستمر */
#spark{
  position:absolute;top:0;bottom:0;left:50%;width:220px;
  transform:translateX(-50%);opacity:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 50% 70% at 50% 50%,rgba(255,255,255,.55),transparent 72%);
  transition:left .6s cubic-bezier(.22,1,.3,1);
}
#spark.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* ---------- الأسامي ------------------------------------- */
.nm{
  position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:16px;
  z-index:2;font-size:46px;font-weight:900;color:#fff;
  text-shadow:0 3px 12px rgba(0,0,0,.6);white-space:nowrap;
  max-width:44%;overflow:hidden;
}
.nm.a{left:54px}
.nm.b{right:54px;flex-direction:row-reverse}
.crown{width:40px;height:40px;opacity:0;transform:translateY(5px);transition:opacity .3s,transform .3s;flex:none}
.nm.win .crown{opacity:1;transform:none}

/* ---------- السطر التحت ---------------------------------- */
#under{
  position:relative;height:52px;margin-top:14px;
}
#gap{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  display:none;align-items:center;gap:9px;direction:rtl;
  padding:8px 22px;border-radius:999px;
  background:rgba(8,4,16,.82);border:1px solid rgba(255,255,255,.18);
  font-size:24px;font-weight:700;color:rgba(255,255,255,.92);white-space:nowrap;
  transition:left .6s cubic-bezier(.22,1,.3,1);
}
#gap.on{display:inline-flex}
#gap b{font-family:'Oxanium',sans-serif;font-variant-numeric:tabular-nums;font-size:27px}

/* ---------- العنوان والوقت ------------------------------- */
#top{display:flex;align-items:center;justify-content:center;gap:14px;height:46px;margin-bottom:14px}
#title{
  padding:7px 22px;border-radius:12px;
  background:rgba(8,4,16,.78);border:1px solid rgba(255,255,255,.16);
  font-size:29px;font-weight:900;color:#fff;
}
#title.off{display:none}
#clock{
  display:none;align-items:center;gap:9px;padding:6px 18px;border-radius:12px;
  background:rgba(8,4,16,.78);border:1px solid rgba(255,255,255,.16);
  font-family:'Oxanium',sans-serif;font-variant-numeric:tabular-nums;
  font-size:27px;font-weight:800;color:#fff;
}
#clock.on{display:inline-flex}
#clock s{width:9px;height:9px;border-radius:50%;background:#ff5a6e;text-decoration:none}
#clock.over s{background:rgba(255,255,255,.3)}

#mark{
  position:absolute;right:34px;bottom:28px;
  font-size:24px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.42);
}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div id="stage">
  <div id="wrap">
    <div id="top">
      <div id="clock"><s></s><span id="cv">00:00</span></div>
      <div id="title">تحدي الفرق</div>
    </div>

    <div id="wings">
      <div class="wing a" id="wa" style="--col:var(--c1)"><span class="sc" id="v1">0</span></div>
      <div class="wing b" id="wb" style="--col:var(--c2)"><span class="sc" id="v2">0</span></div>
    </div>

    <div id="bar">
      <div class="half a" id="hA" style="--col:var(--c1)"></div>
      <div class="half b" id="hB" style="--col:var(--c2)"></div>
      <div id="spark"></div>
      <div id="blade"><i></i></div>

      <div class="nm a" id="na">
        <span id="n1">الفريق الأول</span>
        <svg class="crown" viewBox="0 0 24 24" fill="#ffd76a" aria-hidden="true"><path d="M3 18h18l-1.6-9-4.4 3.4L12 6l-3 6.4L4.6 9 3 18z"/></svg>
      </div>
      <div class="nm b" id="nb">
        <span id="n2">الفريق الثاني</span>
        <svg class="crown" viewBox="0 0 24 24" fill="#ffd76a" aria-hidden="true"><path d="M3 18h18l-1.6-9-4.4 3.4L12 6l-3 6.4L4.6 9 3 18z"/></svg>
      </div>
    </div>

    <div id="under">
      <div id="gap">فارق <b id="gv">0</b> <span id="gu">نقطة</span></div>
    </div>
  </div>

  <div id="mark" hidden>TILAGO</div>
</div>

<script>
(function () {
  "use strict";

  var STAGE_W = 1920, STAGE_H = 1080;
  var stage  = document.getElementById("stage");
  var params = new URLSearchParams(location.search);

  /* الإعدادات بتيجي محقونة من السيرفر في رابط العميل، ومن الرابط في
     المعاينة. التركيبة مش فارق معاها الاتنين. */
  var CFG = window.__T || {};
  function P(k) { return CFG[k] != null ? String(CFG[k]) : params.get(k); }

  function fit() {
    var s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
    stage.style.transform =
      "translate(" + ((innerWidth  - STAGE_W * s) / 2) + "px," +
                     ((innerHeight - STAGE_H * s) / 2) + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();

  /* ---------- الإعدادات ---------- */
  var root = document.documentElement;
  ["violet","grape","navy","deep","ink","c1","c2"].forEach(function (k) {
    var v = P(k);
    if (v) root.style.setProperty("--" + k, v);
  });

  var titleEl = document.getElementById("title");
  var title = P("title");
  if (title !== null) {
    if (title === "") titleEl.classList.add("off");
    else titleEl.textContent = title;
  }

  var n1 = P("t1"); if (n1) document.getElementById("n1").textContent = n1;
  var n2 = P("t2"); if (n2) document.getElementById("n2").textContent = n2;

  var unit = P("unit");
  if (unit !== null) document.getElementById("gu").textContent = unit;

  if (P("mark") === "1") document.getElementById("mark").hidden = false;

  /* ---------- النتيجة ---------- */
  var v1 = document.getElementById("v1"), v2 = document.getElementById("v2");
  var wa = document.getElementById("wa"), wb = document.getElementById("wb");
  var na = document.getElementById("na"), nb = document.getElementById("nb");
  var hA = document.getElementById("hA"), hB = document.getElementById("hB");
  var blade = document.getElementById("blade"), spark = document.getElementById("spark");
  var gapEl = document.getElementById("gap"), gv = document.getElementById("gv");
  var cur = [null, null];

  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;                 /* إعادة تشغيل الحركة */
    el.classList.add("bump");
    setTimeout(function () { el.classList.remove("bump"); }, 320);
  }

  function flash() {
    spark.classList.remove("go");
    void spark.offsetWidth;
    spark.classList.add("go");
  }

  function render(a, b) {
    a = Math.max(0, a | 0); b = Math.max(0, b | 0);
    var first = cur[0] === null, moved = false;

    if (cur[0] !== a) { v1.textContent = a; if (!first) { bump(v1); moved = true; } cur[0] = a; }
    if (cur[1] !== b) { v2.textContent = b; if (!first) { bump(v2); moved = true; } cur[1] = b; }
    if (moved) flash();

    /* الاتنين بصفر = الفاصل في النص. وبنسيب 14% لكل جنب على الأقل
       عشان الاسم مايتقصّش لو حد كاسح. */
    var pct = (a + b) === 0 ? 50 : (a / (a + b)) * 100;
    pct = Math.min(86, Math.max(14, pct));

    document.getElementById("wrap").style.setProperty("--pct", pct + "%");
    hA.style.width = pct + "%";
    hB.style.width = (100 - pct) + "%";
    blade.style.left = pct + "%";
    spark.style.left = pct + "%";
    gapEl.style.left = pct + "%";

    wa.classList.toggle("win", a > b);
    wb.classList.toggle("win", b > a);
    na.classList.toggle("win", a > b);
    nb.classList.toggle("win", b > a);

    var d = Math.abs(a - b);
    gapEl.classList.toggle("on", d > 0);
    gv.textContent = d;
  }

  render(parseInt(P("s1") || "0", 10), parseInt(P("s2") || "0", 10));

  /* ---------- عدّاد التحدي ---------- */
  var until = P("until");
  if (until) {
    var target = new Date(until).getTime();
    if (!isNaN(target)) {
      var clock = document.getElementById("clock");
      var out = document.getElementById("cv");
      clock.classList.add("on");

      (function tick() {
        var ms = target - Date.now();
        if (ms <= 0) {
          /* خلص الوقت: العدّاد بيقف على صفر والنقطة بتطفي، عشان
             المذيع يعرف إن التحدي انتهى من غير ما الشاشة تفضى */
          clock.classList.add("over");
          out.textContent = "00:00";
          return;
        }
        var s = Math.floor(ms / 1000);
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
        var p = function (x) { return String(x).padStart(2, "0"); };
        out.textContent = h > 0 ? p(h) + ":" + p(m) + ":" + p(ss) : p(m) + ":" + p(ss);
        setTimeout(tick, 500);
      })();
    }
  }

  /* ---------- وضع العرض ----------
     في صفحة الموقع بس. مقفول في رابط العميل عشان ماتتحركش أرقام
     وهمية على بثه. */
  if (P("demo") === "1") {
    var a = 3, b = 2;
    setInterval(function () {
      if (Math.random() < .5) a += 1 + (Math.random() * 3 | 0);
      else                    b += 1 + (Math.random() * 3 | 0);
      if (a + b > 90) { a = 3; b = 2; }
      render(a, b);
    }, 1500);
  }
})();
</script>
